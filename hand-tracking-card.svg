  </defs>
  <rect x="1" y="1" width="558" height="188" rx="15" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(25 23)" fill="none" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
