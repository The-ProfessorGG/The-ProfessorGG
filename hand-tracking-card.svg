<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">Hand Tracking Mouse Control</title>
  <desc id="desc">Project card for computer vision hand tracking and gesture-based mouse control.</desc>
