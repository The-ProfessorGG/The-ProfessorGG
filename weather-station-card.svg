<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">ESP8266 Weather Station</title>
  <desc id="desc">Project card for an IoT weather station with local sensors and live weather data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07141B"/><stop offset="1" stop-color="#0B2430"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#10B981"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="188" rx="15" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="29" y="34" width="127" height="118" rx="9" fill="#061018" stroke="#38BDF8" stroke-opacity=".65"/>
  <text x="42" y="53" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#7DD3FC">LOCAL WX  [W]</text>
  <circle cx="66" cy="83" r="14" fill="#FBBF24"/><g stroke="#FBBF24"><path d="M66 61v-8M66 113v-8M44 83h-8M96 83h-8M50 67l-6-6M88 105l-6-6M50 99l-6 6M88 61l-6 6"/></g>
  <path d="M74 104c0-11 9-20 20-20 9 0 17 6 19 14 9 0 16 7 16 16H72c0-4 1-7 2-10z" fill="#CBD5E1" stroke="#F8FAFC" stroke-opacity=".55"/>
  <text x="42" y="135" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#94A3B8">22.5°C  61%  1013hPa</text>
  <text x="176" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">ESP8266 Weather Station</text>
  <text x="176" y="69" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#38BDF8">LOCAL + CLOUD SENSING</text>
  <text x="176" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94A3B8">Temperature, humidity, pressure and light</text>
  <text x="176" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94A3B8">with OLED and OpenWeatherMap data.</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11">
    <rect x="176" y="137" width="70" height="23" rx="11" fill="#10283A"/><text x="188" y="153" fill="#7DD3FC">ESP8266</text>
    <rect x="254" y="137" width="64" height="23" rx="11" fill="#0D2B26"/><text x="267" y="153" fill="#6EE7B7">Sensors</text>
    <rect x="326" y="137" width="55" height="23" rx="11" fill="#332713"/><text x="339" y="153" fill="#FDE68A">OLED</text>
  </g>
  <text x="524" y="164" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#10B981">● COMPLETE</text>
</svg>
