<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">Live Classroom Quiz</title>
  <desc id="desc">Project card for a live classroom quiz and leaderboard platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0C18"/><stop offset="1" stop-color="#15102A"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8B5CF6"/><stop offset=".55" stop-color="#EC4899"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="188" rx="15" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="30" y="31" width="123" height="128" rx="10" fill="#0A101F" stroke="#8B5CF6" stroke-opacity=".7"/>
  <text x="46" y="53" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#A78BFA">LIVE LEADERBOARD</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="11">
    <circle cx="48" cy="76" r="10" fill="#FBBF24"/><text x="45" y="80" fill="#111827">1</text><rect x="66" y="70" width="69" height="12" rx="6" fill="#7C3AED"/><text x="70" y="80" fill="#F8FAFC">1000</text>
    <circle cx="48" cy="106" r="10" fill="#94A3B8"/><text x="45" y="110" fill="#111827">2</text><rect x="66" y="100" width="57" height="12" rx="6" fill="#6D28D9"/><text x="70" y="110" fill="#F8FAFC">850</text>
    <circle cx="48" cy="136" r="10" fill="#B45309"/><text x="45" y="140" fill="#F8FAFC">3</text><rect x="66" y="130" width="44" height="12" rx="6" fill="#5B21B6"/><text x="70" y="140" fill="#F8FAFC">720</text>
  </g>
  <circle cx="142" cy="43" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="176" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#F8FAFC">Live Classroom Quiz</text>
  <text x="176" y="69" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#C084FC">INTERACTIVE LEARNING</text>
  <text x="176" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94A3B8">QR joining, timed questions, live scoring</text>
  <text x="176" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#94A3B8">and real-time classroom leaderboards.</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11">
    <rect x="176" y="137" width="58" height="23" rx="11" fill="#21163F"/><text x="190" y="153" fill="#C4B5FD">React</text>
    <rect x="242" y="137" width="75" height="23" rx="11" fill="#3A162E"/><text x="252" y="153" fill="#F9A8D4">Firebase</text>
    <rect x="325" y="137" width="83" height="23" rx="11" fill="#10283A"/><text x="337" y="153" fill="#67E8F9">QR Codes</text>
  </g>
  <text x="524" y="164" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#22C55E">● ONLINE</text>
</svg>
